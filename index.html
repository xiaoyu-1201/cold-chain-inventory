<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 安全規則：只執行自己網站的程式；資料只准送到 Google AI 和你自己的 Apps Script（被塞進奇怪的程式碼也送不出去） -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' https://generativelanguage.googleapis.com https://script.google.com https://script.googleusercontent.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="聖佳庫存" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="聖佳冷凍材料的智慧庫存工具：拍貨架 AI 盤點、品項庫、查型號與替代品、盤差與複盤。" />
    <title>聖佳智慧庫存</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <noscript>這個工具需要開啟 JavaScript。</noscript>
    <script type="module" src="app.js"></script>
  </body>
</html>
